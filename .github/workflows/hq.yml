# Keeps the founder's HQ dashboard live, for free, with no server and no session.
#
# This validates state.json and checks that docs/ — the folder GitHub Pages serves
# straight from this branch — is actually in sync with hq/. It does NOT deploy.
#
# Pages is configured as "Deploy from a branch" on /docs, so GitHub publishes the
# folder on every push with no workflow involved. That removes the github-pages
# environment and its deployment branch rule, which is what failed repeatedly.
name: HQ

on:
  push:
    branches: [claude/construction-venture]
    paths: ["hq/**", "docs/**", ".github/workflows/hq.yml"]
  workflow_dispatch: {}

# Allow the Pages deployment, and let a newer run supersede an in-flight one
# rather than queueing stale dashboards behind it.
permissions:
  contents: read

concurrency:
  group: hq-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Fails on malformed state, a bad status, or a funnel figure typed as text,
      # so a broken dashboard never reaches the founder.
      - name: Validate state
        run: node hq/validate.mjs

      # state.js is the offline fallback; regenerating here means it cannot drift.
      - name: Rebuild offline state
        run: node hq/build.mjs

      # docs/ is what Pages serves. If it has drifted from hq/, the live dashboard is
      # stale and that must fail loudly rather than quietly serve old numbers.
      - name: Check the published copy is in sync
        run: |
          mkdir -p docs
          cp hq/index.html hq/state.json hq/state.js docs/
          if ! git diff --quiet -- docs/ hq/state.js; then
            echo "::error title=docs out of sync::docs/ does not match hq/. Run ./hq/sync.sh and push."
            git diff --stat -- docs/ hq/state.js
            exit 1
          fi
          echo "docs/ matches hq/ — Pages is serving current state."

# Keeps the founder's HQ dashboard live, for free, with no server and no session.
#
# On every push that touches hq/, this validates state.json, regenerates the
# offline state.js from it, and publishes hq/ to GitHub Pages. The dashboard then
# re-reads state.json every 30 seconds, so an open tab updates itself.
#
# The first run enables Pages itself (configure-pages with enablement: true). If your
# org policy blocks that, set it by hand: Settings -> Pages -> Source: "GitHub Actions".
name: HQ

on:
  push:
    branches: [claude/construction-venture]
    paths: ["hq/**", ".github/workflows/hq.yml"]
  workflow_dispatch: {}

# Allow the Pages deployment, and let a newer run supersede an in-flight one
# rather than queueing stale dashboards behind it.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hq-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Fails the run on a malformed or invented-number state file, so a broken
      # dashboard never reaches the founder.
      - name: Validate state
        run: node hq/validate.mjs

      # state.js is the offline fallback the dashboard uses when opened from disk.
      # Regenerating here means it can never drift from state.json.
      - name: Rebuild offline state
        run: |
          node hq/build.mjs
          git diff --stat -- hq/state.js

      # Pages cannot be created by this workflow's token ("Resource not accessible by
      # integration"), so until a repo admin enables it the deploy is skipped rather than
      # failed. The validation above is the part worth failing on; a missing Pages site is
      # a setup step, not a broken dashboard.
      - id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Say what to do if Pages is off
        if: steps.pages.outcome != 'success'
        run: |
          echo "::notice title=Pages not enabled::State validated and rebuilt, but there is no"\
               "GitHub Pages site to publish to. A repo admin enables it once:"\
               "Settings -> Pages -> Source: 'GitHub Actions'. Then re-run this workflow."

      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: hq

      - id: deploy
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
